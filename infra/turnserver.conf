# coturn — configuración para credenciales efímeras (REST API)

# Puertos
listening-port=3478
tls-listening-port=5349

# Rango de puertos de relay (UDP). Ábrelos en el firewall.
min-port=49152
max-port=65535

# Autenticación por secreto compartido (time-limited credentials).
# Debe ser IGUAL a TURN_SECRET en el signaling-server.
use-auth-secret
static-auth-secret=CAMBIA-ESTE-SECRETO

# Tu dominio / IP pública (obligatorio para que funcione tras NAT).
realm=tu-dominio.com
# external-ip=TU_IP_PUBLICA

# Endurecimiento
no-multicast-peers
no-cli
fingerprint
stale-nonce=600

# TLS (opcional, recomendado en producción)
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/key.pem
