version: 2
updates:
  # Dependencias npm del monorepo
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
  # Actions del CI/release
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
