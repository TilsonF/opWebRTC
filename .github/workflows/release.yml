name: Release

# Publica @opwebrtc/core a npm al pushear un tag vX.Y.Z.
# Requiere el secreto NPM_TOKEN (token "Automation" de npm) en el repo.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      - name: Publicar a npm
        run: npm publish -w @opwebrtc/core --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
