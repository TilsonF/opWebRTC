name: Release

# Publica todos los paquetes @opwebrtc/* a npm.
# Autenticación por token (NPM_TOKEN, granular acotado al scope @opwebrtc):
# un solo secreto publica todos los paquetes, sin Trusted Publisher por paquete.
# Se dispara por tag vX.Y.Z o manualmente (workflow_dispatch).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      - name: Publicar paquetes (salta los ya publicados)
        run: |
          for pkg in core signaling-server react vue angular; do
            name="@opwebrtc/$pkg"
            ver=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "→ $name@$ver ya publicado, salto"
            else
              echo "→ publicando $name@$ver"
              npm publish -w "$name" --provenance --access public
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
