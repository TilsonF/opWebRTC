name: Release

# Publica @opwebrtc/core a npm al pushear un tag vX.Y.Z.
# Usa Trusted Publishing (OIDC): sin tokens de larga vida. La identidad del
# workflow se verifica contra el "Trusted Publisher" configurado en npm.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC (trusted publishing) + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) requiere npm >= 11.5.1; Node 22 trae npm 10.x.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build

      - name: Publicar a npm (OIDC, sin token)
        run: npm publish -w @opwebrtc/core --provenance --access public
