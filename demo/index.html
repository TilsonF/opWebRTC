<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>opWebRTC · demo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Pantalla previa: sala + dispositivos -->
    <section id="prejoin" class="prejoin">
      <h1>opWebRTC</h1>
      <p class="sub">videollamada P2P · personalizable · segura</p>
      <div class="form">
        <label>Sala
          <input id="room" value="sala-demo" />
        </label>
        <label>Cámara
          <select id="pre-cam"></select>
        </label>
        <label>Micrófono
          <select id="pre-mic"></select>
        </label>
        <label>Token (si el servidor pide auth)
          <input id="token" placeholder="opcional" />
        </label>
        <button id="join" class="primary">Entrar a la llamada</button>
      </div>
    </section>

    <!-- Pantalla de llamada -->
    <section id="call" class="call hidden">
      <header class="topbar">
        <div class="logo" id="logo">opWebRTC</div>
        <div class="badges">
          <span id="state" class="badge">idle</span>
          <span id="stats" class="badge stats">—</span>
        </div>
      </header>

      <div class="stage">
        <video id="remote" autoplay playsinline></video>
        <video id="local" class="pip" autoplay playsinline muted></video>
      </div>

      <footer class="toolbar">
        <button id="mic" class="ctrl" title="Micrófono">🎙️</button>
        <button id="cam" class="ctrl" title="Cámara">📷</button>
        <button id="screen" class="ctrl" title="Compartir pantalla">🖥️</button>
        <button id="blur" class="ctrl" title="Difuminar fondo">🌫️</button>
        <select id="cam-select" class="ctrl-select" title="Cambiar cámara"></select>
        <select id="mic-select" class="ctrl-select" title="Cambiar micrófono"></select>
        <button id="hangup" class="ctrl danger" title="Colgar">📞</button>
      </footer>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
