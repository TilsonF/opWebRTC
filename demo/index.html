<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>opWebRTC · demo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Pantalla previa: sala + dispositivos -->
    <section id="prejoin" class="prejoin">
      <h1>opWebRTC</h1>
      <p class="sub">videollamada P2P · personalizable · segura</p>
      <div class="form">
        <label>Tu nombre
          <input id="name" placeholder="¿Cómo te llamas?" />
        </label>
        <label>Sala
          <input id="room" value="sala-demo" />
        </label>
        <label>Cámara
          <select id="pre-cam"></select>
        </label>
        <label>Micrófono
          <select id="pre-mic"></select>
        </label>
        <label>Token (si el servidor pide auth)
          <input id="token" placeholder="opcional" />
        </label>
        <label class="check">
          <input type="checkbox" id="approval" />
          Requiere aprobación del anfitrión (sala de espera)
        </label>
        <button id="join" class="primary">Entrar a la llamada</button>
      </div>
    </section>

    <!-- Pantalla de llamada -->
    <section id="call" class="call hidden">
      <header class="topbar">
        <div class="logo" id="logo">opWebRTC</div>
        <div class="badges">
          <span id="admin-badge" class="badge admin hidden">admin</span>
          <span id="state" class="badge">idle</span>
          <span id="stats" class="badge stats">—</span>
        </div>
      </header>

      <div class="content">
        <div class="stage" id="stage">
          <video id="screenView" autoplay playsinline></video>
          <video id="remote" autoplay playsinline></video>
          <video id="local" autoplay playsinline muted></video>
          <div id="placeholder" class="placeholder">Esperando al otro participante…</div>
          <span id="peer-name" class="name-tag hidden"></span>
        </div>
        <aside id="chat" class="chat hidden">
          <div class="chat-header">Chat</div>
          <div id="chat-log" class="chat-log"></div>
          <form id="chat-form" class="chat-input">
            <input id="chat-text" placeholder="Escribe un mensaje…" autocomplete="off" />
            <button type="submit" aria-label="Enviar">
              <svg class="ic" viewBox="0 0 24 24"><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </form>
        </aside>
      </div>

      <footer class="toolbar">
        <button id="mic" class="ctrl" title="Micrófono" aria-label="Micrófono">
          <svg class="ic ic-on" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
          <svg class="ic ic-off" viewBox="0 0 24 24"><line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        </button>
        <button id="cam" class="ctrl" title="Cámara" aria-label="Cámara">
          <svg class="ic ic-on" viewBox="0 0 24 24"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>
          <svg class="ic ic-off" viewBox="0 0 24 24"><path d="M10.66 6H14a2 2 0 0 1 2 2v2.34l1 1L22 8v8"/><path d="M16 16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2l10 10Z"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
        </button>
        <button id="screen" class="ctrl" title="Compartir pantalla" aria-label="Compartir pantalla">
          <svg class="ic" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
        </button>
        <button id="blur" class="ctrl" title="Difuminar fondo" aria-label="Difuminar fondo">
          <svg class="ic" viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
        </button>
        <button id="chat-toggle" class="ctrl" title="Chat" aria-label="Chat">
          <svg class="ic" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
          <span id="chat-unread" class="unread hidden">0</span>
        </button>

        <span class="divider"></span>

        <label class="select-wrap" title="Cambiar cámara">
          <svg class="ic sm" viewBox="0 0 24 24"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>
          <select id="cam-select"></select>
        </label>
        <label class="select-wrap" title="Cambiar micrófono">
          <svg class="ic sm" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
          <select id="mic-select"></select>
        </label>

        <span class="divider"></span>

        <button id="kick" class="ctrl danger hidden" title="Sacar al participante" aria-label="Sacar al participante">
          <svg class="ic" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" x2="22" y1="8" y2="13"/><line x1="22" x2="17" y1="8" y2="13"/></svg>
        </button>
        <button id="hangup" class="ctrl danger" title="Colgar" aria-label="Colgar">
          <svg class="ic" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>
        </button>
      </footer>
    </section>

    <!-- Sala de espera (invitado) -->
    <div id="waiting-overlay" class="overlay hidden">
      <div class="overlay-card">
        <div class="spinner"></div>
        <p>Esperando que el anfitrión te admita…</p>
      </div>
    </div>

    <!-- Solicitud de ingreso (anfitrión) -->
    <div id="admit-prompt" class="overlay hidden">
      <div class="overlay-card">
        <p><strong id="admit-name"></strong> quiere unirse a la sala.</p>
        <div class="overlay-actions">
          <button id="admit-yes" class="primary">Admitir</button>
          <button id="admit-no">Rechazar</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
