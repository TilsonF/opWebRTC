<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>opWebRTC · demo</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #0d1117;
        color: #e6edf3;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 1.5rem;
      }
      h1 { font-size: 1.25rem; margin: 0; }
      .videos { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
      video {
        width: 360px;
        max-width: 90vw;
        aspect-ratio: 16 / 9;
        background: #161b22;
        border-radius: 12px;
        object-fit: cover;
        border: 1px solid #30363d;
      }
      .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      input, button {
        font: inherit;
        padding: 0.5rem 0.9rem;
        border-radius: 8px;
        border: 1px solid #30363d;
        background: #21262d;
        color: #e6edf3;
        cursor: pointer;
      }
      input { cursor: text; }
      button:hover { background: #30363d; }
      #state { font-variant: small-caps; opacity: 0.8; }
    </style>
  </head>
  <body>
    <h1>opWebRTC · videollamada 1‑a‑1</h1>
    <div class="controls">
      <input id="room" placeholder="nombre de la sala" value="sala-demo" />
      <button id="join">Unirse</button>
      <button id="cam">Cámara</button>
      <button id="mic">Micrófono</button>
      <button id="hangup">Colgar</button>
    </div>
    <span id="state">idle</span>
    <div class="videos">
      <video id="local" autoplay playsinline muted></video>
      <video id="remote" autoplay playsinline></video>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
